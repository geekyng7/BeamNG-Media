<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BeamNG Media Bridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="shell">
        <header class="top">
            <span id="status" class="pill">Подключение…</span>
            <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch to English">EN</button>
        </header>

        <div class="grid">
            <section class="card run">
                <h3 data-i18n="launchGame">Запустить игру</h3>
                <p data-i18n="steamOnly">Только Steam-версия</p>
                <a class="cta" href="steam://rungameid/284160" rel="noopener noreferrer"
                    data-i18n="launch">Запустить</a>
            </section>
            <section class="card author">
                <h3 data-i18n="mods">Моды для BeamNG.drive</h3>
                <p data-i18n="modsInfo">Новые релизы, обновления и исходники — в Telegram-канале.</p>
                <a class="cta" href="https://t.me/mods_base" target="_blank" rel="noopener noreferrer"
                    data-i18n="openChannel">Открыть @mods_base</a>
            </section>
            <section class="card player" aria-label="Текущий трек" data-i18n-aria="currentTrack">
                <div class="cover" id="cover"></div>
                <div class="meta">
                    <h2 id="track" data-i18n="waitingPlayer">Ожидание плеера</h2>
                    <p id="artist" data-i18n="startMusic">Запустите музыку в Windows</p>
                    <div class="controls">

                        <button data-command="toggle" id="toggle" aria-label="Пауза или продолжение"
                            data-i18n-aria="playPause">▶</button>

                    </div>
                </div>
            </section>
            
        </div>

        <footer>
            <span>Windows 10/11</span>
            <a href="https://t.me/mods_base" target="_blank" rel="noopener noreferrer">t.me/mods_base</a>
        </footer>
    </main>
    <script src="renderer.js"></script>
</body>

</html>
